<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Minutes · ローカル議事録</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/speakers.css"><script type="module" src="/static/app.js"></script></head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">∿</span>Local Minutes</div><span class="local"><i></i> この端末内で処理</span></header>
<div class="layout"><aside><button id="new" class="new">＋　新しい会議</button><h2>会議履歴</h2><nav id="history" aria-label="会議履歴"></nav><button id="settings" class="settings">⚙　ローカル設定</button></aside>
<main><div id="notice" role="alert" hidden></div><div class="meta" id="date"></div>
<h1 id="heading">新しい会議</h1>
<section id="compose">
<label for="title">会議名</label><input maxlength="120" id="title" type="text" placeholder="例）開発チームの定例会議" autocomplete="off" spellcheck="false">
<div class="countrow"><label for="mode">録音モード</label><select id="mode"><option value="microphone">対面会議（マイク）</option><option value="online">オンライン会議（マイク＋PC音声）</option></select></div>
<div class="countrow"><label for="count">会議の話者数</label><select id="count"><option value="0">自動推定</option><option value="1">1人</option><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option><option value="5">5人</option><option value="6">6人</option><option value="7">7人</option><option value="8">8人</option><option value="9">9人</option><option value="10">10人</option><option value="11">11人</option><option value="12">12人</option></select></div>
<div class="recbox"><div class="topline"><span class="caps" id="micStatus">マイク録音</span><span id="timer">00:00</span></div>
<canvas id="wave" height="70" aria-label="マイク入力レベル"></canvas>
<div id="inputs" hidden><div class="meterRow"><label for="micLevel">自分のマイク</label><meter id="micLevel" min="0" max="1" value="0"></meter></div>
<div class="meterRow"><label for="pcLevel">相手の音声</label><meter id="pcLevel" min="0" max="1" value="0"></meter></div>
<p id="pcInfo" aria-live="polite"></p></div>
<div class="recactions"><button id="record" class="primary"><span class="dot"></span> 録音を開始</button><span id="recHint">停止すると議事録を作成します</span></div></div>
<div class="importrow"><span>録音済みの音声を使う</span><button id="import">ファイルを選択 ↗</button><input type="file" id="file" accept=".wav,.m4a,.mp3,.mp4,.ogg,.aac,.webm,.flac,.aiff" hidden></div>
</section>
<section id="meeting" hidden><div class="statecard"><div id="phase"></div><p id="detail" aria-live="polite"></p><button id="retry" hidden>議事録を作成</button></div>
<audio id="player" aria-label="保存した音声を再生" controls preload="metadata" hidden></audio>
<button id="reanalyze" hidden title="保存済みの音声を現在の設定で解析し、別の議事録に保存します">この音声で新しく解析</button>
<div class="tabs"><button id="tabSummary" aria-pressed="true">要約</button><button id="tabText" aria-pressed="false">文字起こし</button><button id="export" hidden>↓ Markdown 保存</button></div>
<div id="speakerActions"></div><article id="content"></article></section>
</main></div>
<dialog id="dialog"><h2>ローカル設定</h2>
<label for="model">Whisper モデル（.pt）</label><input id="model" spellcheck="false" list="availableModels"><datalist id="availableModels"></datalist><p>インストール済みのモデルを選ぶか、絶対パスを入力してください。large-v3-turbo は精度を重視する場合に使えます。</p>
<label for="gguf">生成要約モデル（.gguf・任意）</label><input id="gguf" spellcheck="false"><p>空欄の場合は、発言から重要な文を抽出します。生成要約には llama-cpp-python が必要です。</p>
<h3>会議の保存先</h3><code id="storage"></code><p id="settingsError" role="alert"></p>
<div class="dialogactions"><button id="cancelSettings">閉じる</button><button class="primary" id="saveSettings">設定を保存</button></div></dialog>
</body></html>
